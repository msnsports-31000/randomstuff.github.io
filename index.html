<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10-Store Directory</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --accent-color: #008a00;
      --text-color: #222222;
      --subtext-color: #666666;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      background: var(--card-bg);
      padding: 1.5rem 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .badge {
      background-color: var(--accent-color);
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1rem;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .app-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .app-header {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .app-icon {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      background-color: #eee;
    }

    .app-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin: 0;
    }

    .app-publisher {
      font-size: 0.8rem;
      color: var(--subtext-color);
    }

    .app-version {
      font-size: 0.8rem;
      color: var(--subtext-color);
      margin-top: 0.2rem;
    }

    .app-desc {
      font-size: 0.85rem;
      line-height: 1.4;
      color: #444;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .download-btn {
      display: inline-block;
      text-align: center;
      background-color: var(--accent-color);
      color: white;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .download-btn:hover {
      opacity: 0.9;
    }

    .status {
      text-align: center;
      font-size: 1.1rem;
      color: var(--subtext-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>10-Store Directory</h1>
      <div>Total Apps: <span id="app-count" class="badge">...</span></div>
    </div>

    <div id="status" class="status">Loading store items...</div>
    <div id="app-grid" class="app-grid"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10Store - WebStore</title>
<style>
:root {
  --accent: #0078D7;
  --accent-hover: #005A9E;
  --bg-color: #111111;
  --header-bg: #1A1A1A;
  --tile-bg: #1e1e1e;
  --tile-hover: #282828;
  --text-main: #ffffff;
  --text-muted: #9e9e9e;
  --search-bg: #2a2a2a;
  --search-border: #3d3d3d;
  --modal-bg: #141414;
  --tile-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
  --tile-shadow-hover: 0 12px 30px rgba(0, 0, 0, 0.85);
}

[data-theme="light"] {
  --bg-color: #f4f4f4;
  --header-bg: #e5e5e5;
  --tile-bg: #ffffff;
  --tile-hover: #f9f9f9;
  --text-main: #111111;
  --text-muted: #666666;
  --search-bg: #ffffff;
  --search-border: #cccccc;
  --modal-bg: #ffffff;
  --tile-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
  --tile-shadow-hover: 0 12px 28px rgba(0, 0, 0, 0.35);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  font-family: "Segoe UI Light", "Segoe UI", Tahoma, Arial, sans-serif;
  font-weight: 300;
}

body {
  color: var(--text-main);
  background: var(--bg-color);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }

/* HEADER */
#Header {
  background: var(--header-bg);
  height: 80px;
  display: flex;
  align-items: center;
  padding: 0 40px;
  color: var(--text-main);
  flex-shrink: 0;
  transition: background 0.2s;
}

#HeaderLogo {
  font-size: 26px;
  color: var(--text-main);
  letter-spacing: 1px;
  cursor: pointer;
}

.nav-tabs {
  display: flex;
  gap: 20px;
  margin-left: 40px;
}

.nav-tab {
  font-size: 20px;
  color: var(--text-muted);
  cursor: pointer;
  padding-bottom: 4px;
  transition: color 0.2s, border-bottom 0.2s;
}

.nav-tab.active, .nav-tab:hover {
  color: var(--text-main);
  border-bottom: 3px solid var(--accent);
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 15px;
}

#Search {
  background: var(--search-bg);
  height: 36px;
  width: 240px;
  border: 1px solid var(--search-border);
  color: var(--text-main);
  padding: 0 12px;
  font-size: 14px;
  outline: none;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
#Search::placeholder { color: var(--text-muted); }
#Search:focus { border-color: var(--accent); }

.theme-btn {
  background: transparent;
  border: 1px solid var(--text-main);
  color: var(--text-main);
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}
.theme-btn:hover {
  background: var(--text-main);
  color: var(--bg-color);
}

/* HORIZONTAL CONTAINER */
#HorizontalContainer {
  width: 100vw;
  flex: 1;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 30px 40px 40px 40px;
  white-space: nowrap;
}

#HorizontalWrapper {
  display: inline-flex;
  gap: 45px;
  height: 100%;
}

.category-column {
  display: inline-flex;
  flex-direction: column;
  height: 100%;
}

.category-title {
  font-size: 22px;
  color: var(--text-main);
  margin-bottom: 16px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* VERTICAL TILE GRID */
.app-tiles-grid {
  display: grid;
  grid-template-rows: repeat(2, 230px);
  grid-auto-flow: column;
  gap: 20px;
}

@media (max-height: 650px) {
  .app-tiles-grid {
    grid-template-rows: repeat(1, 230px);
  }
}

/* VERTICAL CARD STYLE */
.app-tile {
  width: 160px;
  height: 230px;
  background: var(--tile-bg);
  padding: 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  white-space: normal;
  box-shadow: var(--tile-shadow);
  transition: background 0.15s ease, box-shadow 0.2s ease;
}

.app-tile:hover {
  background: var(--tile-hover);
  box-shadow: var(--tile-shadow-hover);
}

.app-tile:active { 
  transform: scale(0.97); 
}

.app-tile .icon-container {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  overflow: hidden;
  border-radius: 2px;
  margin-bottom: 8px;
}

.app-tile .icon-container img { 
  width: 100%; 
  height: 100%; 
  object-fit: cover;
